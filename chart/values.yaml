# Default values for restheart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: softinstigate/restheart
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Optional explicit container command/args override.
# By default, chart uses the Docker image ENTRYPOINT/CMD.
containerCommand: []
containerArgs:
  - "etc/restheart.yml"

# -- Container port. Default 8080 for HTTP, set to 4443 if HTTPS listener is enabled.
containerPort: 8080

# Environment variables for the RESTHeart container.
# The official image defines a default RHO that overrides config options.
# RHO is set to empty so restHeartConfiguration is used as-is.
env:
  - name: RHO
    value: ""

# Additional environment variables from ConfigMaps or Secrets.
# Example:
# envFrom:
#   - configMapRef:
#       name: my-config
#   - secretRef:
#       name: my-secret
envFrom: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  annotations: {}
  # Example for AWS NLB:
  #   service.beta.kubernetes.io/aws-load-balancer-type: nlb

ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# -- Liveness probe configuration.
livenessProbe:
  httpGet:
    path: /ping
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Readiness probe configuration.
readinessProbe:
  httpGet:
    path: /ping
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Startup probe configuration. Gives JVM time to start.
startupProbe:
  httpGet:
    path: /ping
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

# -- Lifecycle hooks. PreStop gives time to drain in-flight requests.
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 5"]

# -- Termination grace period in seconds.
terminationGracePeriodSeconds: 30

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

# If multiple replicas are configured the Pods will not be scheduled
# on the same K8S node. Allowed values: soft, hard, "".
podAntiAffinity: soft

# If affinity is configured, podAntiAffinity settings are ignored.
affinity: {}

# -- Topology spread constraints (alternative to podAntiAffinity).
topologySpreadConstraints: []

# -- Priority class name for the pods.
priorityClassName: ""

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# -- Init container to wait for MongoDB before starting RESTHeart.
waitForMongo:
  enabled: false
  image: busybox:1.36
  host: ""
  port: 27017

# -- Extra init containers to run before the main container.
extraInitContainers: []

# -- Extra sidecar containers.
extraContainers: []

# -- Extra volumes.
extraVolumes: []

# -- Extra volume mounts for the main container.
extraVolumeMounts: []

# -- Network policy. Restricts ingress/egress traffic.
networkPolicy:
  enabled: false
  ingress: []
  egress: []

# Config source for /opt/restheart/etc/restheart.yml
# false (default): use generated Secret from restHeartConfiguration
# true: mount external Secret key as restheart.yml
useExternalConfig: false
externalConfig:
  name: ""
  key: "restheart.yml"

# RESTHeart configuration. Rendered as /opt/restheart/etc/restheart.yml.
# See https://restheart.org/docs/setup/#configuration-files
# and chart/RESTHEART-CONFIG.md for the full reference.
restHeartConfiguration:
  #### Listeners

  https-listener: false
  https-host: localhost
  https-port: 4443
  #keystore-file: /path/to/keystore/file
  #keystore-password: password
  #certpassword: password

  http-listener: true
  http-host: 0.0.0.0
  http-port: 8080

  ajp-listener: false
  ajp-host: localhost
  ajp-port: 8009

  #### Instance

  instance-name: default
  instance-base-url: ""

  #### MongoDB

  mongo-uri: ""

  mongo-mounts:
    - what: /restheart
      where: /

  default-representation-format: STANDARD

  static-resources:
  #  - what: /path/to/resources
  #    where: /static
  #    welcome-file: index.html
  #    embedded: false

  #### Security

  auth-mechanisms:
    tokenBasicAuthMechanism:
      enabled: true
    basicAuthMechanism:
      enabled: true
      authenticator: mongoRealmAuthenticator
    jwtAuthenticationMechanism:
      enabled: false
      algorithm: HS256
      key: secret
      base64Encoded: false
      usernameClaim: sub
      rolesClaim: null
      fixedRoles:
      #  - jwt-role
      issuer: myIssuer
      audience: myAudience
    digestAuthMechanism:
      enabled: false
      realm: RESTHeart Realm
      domain: localhost
      authenticator: mongoRealmAuthenticator
    identityAuthMechanism:
      enabled: false
      username: admin
      roles:
        - admin
        - user

  authenticators:
    fileRealmAuthenticator:
      enabled: false
      conf-file: ./users.yml
    mongoRealmAuthenticator:
      enabled: true
      users-db: restheart
      users-collection: users
      prop-id: _id
      prop-password: password
      json-path-roles: $.roles
      bcrypt-hashed-password: true
      bcrypt-complexity: 12
      enforce-minimum-password-strength: false
      minimum-password-strength: 3
      create-user: true
      create-user-document: ""
      cache-enabled: false
      cache-size: 1000
      cache-ttl: 60000
      cache-expire-policy: AFTER_WRITE

  authorizers:
    fileAclAuthorizer:
      enabled: false
      conf-file: ./acl.yml
    mongoAclAuthorizer:
      enabled: true
      acl-db: restheart
      acl-collection: acl
      root-role: admin
      cache-enabled: true
      cache-size: 1000
      cache-ttl: 5000
      cache-expire-policy: AFTER_WRITE
    originVetoer:
      enabled: false
      whitelist:
        - https://restheart.org
        - http://localhost
    fullAuthorizer:
      enabled: false
      authentication-required: true

  token-manager:
    rndTokenManager:
      enabled: true
      ttl: 15
      srv-uri: /tokens
    jwtTokenManager:
      enabled: false
      key: secret
      ttl: 15
      srv-uri: /tokens
      issuer: restheart.org

  aggregation-check-operators: true
  allow-unescaped-characters-in-url: true

  etag-check-policy:
    db: REQUIRED_FOR_DELETE
    coll: REQUIRED_FOR_DELETE
    doc: OPTIONAL

  #### Plugins

  plugins-directory: plugins

  mongo:
    uri: /
    get-collection-cache-size: 100
    get-collection-cache-ttl: 10_000
    get-collection-cache-docs: 1000

  authTokenService:
    uri: /tokens
  ping:
    enabled: true
    msg: Greetings from RESTHeart!
  roles:
    uri: /roles
  graphql:
    uri: /graphql
    db: restheart
    collection: gql-apps
    default-limit: 100
    max-limit: 1000
    verbose: false
  filterOperatorsBlacklist:
    blacklist: ["$where"]
    enabled: true
  bruteForceAttackGuard:
    enabled: false
    max-failed-attempts: 5
    trust-x-forwarded-for: false
    x-forwarded-for-value-from-last: 0

  #### Logging

  enable-log-file: false
  log-file-path: restheart.log
  enable-log-console: true
  log-level: INFO
  requests-log-level: 1
  ansi-console: true
  metrics-gathering-level: DATABASE
  requests-log-trace-headers:

  #### Performance

  io-threads: 0
  buffer-size: 16364
  direct-buffers: true

  ## Read Performance

  # default-pagesize is the number of documents returned when the pagesize query
  # parameter is not specified
  # see https://restheart.org/docs/mongodb-rest/read-docs#paging
  default-pagesize: 100

  # max-pagesize sets the maximum allowed value of the pagesize query parameter
  # generally, the greater the pagesize, the more json serializan overhead occurs
  # the rule of thumb is not exeeding 1000
  max-pagesize: 1000

  # In order to save bandwitdth RESTHeart can force requests to support the giz encoding (if not, requests will be rejected)
  force-gzip-encoding: false

  ## Caches

  # local-cache allows to cache the db and collection properties to drammatically
  # improve performaces. Without caching, a GET on a document would requires
  # two additional queries to retrieve the db and the collection properties.
  # Pay attention to local caching only in case of multi-node deployments (horizontal scalability).
  # In this case a change in a db or collection properties would reflect on other
  # nodes at worst after TTL milliseconds (cache entries time to live).
  # In most of the cases Dbs and collections properties only change at development time.

  local-cache-enabled: true
  # TTL in milliseconds; specify a value < 0 to never expire cached entries
  local-cache-ttl: 60000

  schema-cache-enabled: true
  # TTL in milliseconds; specify a value < 0 to never expire cached entries
  schema-cache-ttl: 60000

  ## Limits

  # Time limit in milliseconds for processing queries on the server (without network latency). 0 means no time limit
  query-time-limit: 0

  # Time limit in milliseconds for processing aggregations on the server (without network latency). 0 means no time limit
  aggregation-time-limit: 0

  #### Connetction Options

  connection-options:
    # The maximum size of a HTTP header block, in bytes.
    # If a client sends more data that this as part of the request header then the connection will be closed.
    # Defaults to 1Mbyte.
    MAX_HEADER_SIZE: 1048576

    # The default maximum size of a request entity.
    # Defaults to unlimited.
    MAX_ENTITY_SIZE: -1

    #The default maximum size of the HTTP entity body when using the mutiltipart parser.
    # Generall this will be larger than MAX_ENTITY_SIZE
    # If this is not specified it will be the same as MAX_ENTITY_SIZE
    MULTIPART_MAX_ENTITY_SIZE: -1

    # The idle timeout in milliseconds after which the channel will be closed.
    # If the underlying channel already has a read or write timeout set
    # the smaller of the two values will be used for read/write timeouts.
    # Defaults to unlimited (-1).
    IDLE_TIMEOUT: -1

    # The maximum allowed time of reading HTTP request in milliseconds.
    # -1 or missing value disables this functionality.
    REQUEST_PARSE_TIMEOUT: -1

    # The amount of time the connection can be idle with no current requests
    # before it is closed;
    # Defaults to unlimited (-1).
    NO_REQUEST_TIMEOUT: -1

    # The maximum number of query parameters that are permitted in a request.
    # If a client sends more than this number the connection will be closed.
    # This limit is necessary to protect against hash based denial of service attacks.
    # Defaults to 1000.
    MAX_PARAMETERS: 1000

    # The maximum number of headers that are permitted in a request.
    # If a client sends more than this number the connection will be closed.
    # This limit is necessary to protect against hash based denial of service attacks.
    # Defaults to 200.
    MAX_HEADERS: 200

    # The maximum number of cookies that are permitted in a request.
    # If a client sends more than this number the connection will be closed.
    # This limit is necessary to protect against hash based denial of service attacks.
    # Defaults to 200.
    MAX_COOKIES: 200

    # The charset to use to decode the URL and query parameters.
    # Defaults to UTF-8.
    URL_CHARSET: UTF-8

    # If this is true then a Connection: keep-alive header will be added to responses,
    # even when it is not strictly required by the specification.
    # Defaults to true
    ALWAYS_SET_KEEP_ALIVE: true

    # If this is true then a Date header will be added to all responses.
    # The HTTP spec says this header should be added to all responses,
    # unless the server does not have an accurate clock.
    # Defaults to true
    ALWAYS_SET_DATE: true
