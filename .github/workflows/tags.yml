name: Stable Release

on:
  push:
    branches:
      - "!master" # Ignore the master branch
    tags:
      - "*" # Trigger on any tag

jobs:
  # Build and test the project
  build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    # ubuntu-22.04, not ubuntu-latest: the ubuntu-24.04 image 20261018.339.1 (2026-10-18) brings a
    # Linux kernel 6.19+, on which mongod 8.x refuses to start (TCMalloc and rseq, SERVER-131155, fixed
    # in kernel 7.0.14+). Back to ubuntu-latest when the runners carry a fixed kernel.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          # Official mongo image — MongoDB release compatibility matrix. No
          # $vectorSearch/createSearchIndexes support, so restheart-ai's
          # @requires-vector-search karate scenarios are excluded on these legs.
          - mongodb-version: "7.0"
            mongodb-image: "mongo"
            mongodb-profile: "-P-mongodb,mongodb-classic"
            vector-search: "false"
          - mongodb-version: "8.0"
            mongodb-image: "mongo"
            mongodb-profile: "-P-mongodb,mongodb-classic"
            vector-search: "false"
          - mongodb-version: "8.3"
            mongodb-image: "mongo"
            mongodb-profile: "-P-mongodb,mongodb-classic"
            vector-search: "false"
          # mongodb-atlas-local — the default "mongodb" profile's image (mongod +
          # mongot, self-initializing replica set): runs restheart-ai's vector search
          # tests, which none of the official-mongo legs above can.
          - mongodb-version: "preview"
            mongodb-image: "mongodb/mongodb-atlas-local"
            mongodb-profile: ""
            vector-search: "true"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up the GraalVM of the runtime image
        uses: ./.github/actions/setup-graalvm-of-the-image

      - name: Build and Test
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          # Live embedding-provider calls (karate/ai/embedding-provider.feature) only run
          # on the atlas-local leg, and only when a VOYAGE_API_KEY secret is configured —
          # never required for the build to pass otherwise. VOYAGE_API_KEY itself is read
          # directly by test-plugins' aiEmbeddingProviderOverrideInterceptor, per request —
          # no other config/env wiring needed.
          KARATE_EMBEDDING=false
          if [ "${{ matrix.vector-search }}" = "true" ] && [ -n "$VOYAGE_API_KEY" ]; then
            KARATE_EMBEDDING=true
          fi
          mvn -B clean verify ${{ matrix.mongodb-profile }} \
            -Dmongodb.image="${{ matrix.mongodb-image }}" \
            -Dmongodb.version="${{ matrix.mongodb-version }}" \
            -Dkarate.vectorSearch="${{ matrix.vector-search }}" \
            -Dkarate.embeddingProvider="$KARATE_EMBEDDING"

      - name: Upload build artifacts
        if: matrix.mongodb-version == '8.3'
        uses: actions/upload-artifact@v6
        with:
          name: restheart-artifacts
          path: |
            core/target/restheart.jar
            core/target/restheart.tar.gz
            core/target/restheart.zip
            core/target/lib/*.jar
            core/target/plugins/*.jar
            core/target/plugins/lib/*.jar

  # restheart-mqtt is not in the distribution and not in core's test sequence: its integration
  # tests are behind the "mqtt-it" profile and run against the core built alongside it (see
  # mqtt.yml, whose "integration-tests" job this one mirrors). They run here too, so that the
  # archive attached to the release is the one they passed on.
  mqtt-integration-tests:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up the GraalVM of the runtime image
        uses: ./.github/actions/setup-graalvm-of-the-image

      - name: Build core and run the mqtt integration tests
        # the full reactor first, tests skipped: core/copy-plugins.xml stages modules that are
        # not Maven dependencies of core, so "-pl core -am" would leave plugin jars out
        run: |
          mvn -B install -DskipTests
          mvn -B clean verify -pl mqtt -Pmqtt-it

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: mqtt-it-logs
          path: mqtt/target/it-logs/
          if-no-files-found: warn

      - name: Keep the installable archive for the release job
        # uploaded from this job, not rebuilt in the next one: what is released is byte for byte
        # what the integration tests ran against
        uses: actions/upload-artifact@v6
        with:
          name: restheart-mqtt-archive
          path: |
            mqtt/target/restheart-mqtt-*.zip
            mqtt/target/restheart-mqtt-*.tar.gz
          if-no-files-found: error

  # Release the project on GitHub
  release:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    # no release without the mqtt archive: it is attached only if its integration tests passed
    needs: [build, mqtt-integration-tests]
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: restheart-artifacts
          path: core/target/

      - name: Download the mqtt archive
        uses: actions/download-artifact@v5
        with:
          name: restheart-mqtt-archive
          path: mqtt/target/

      - name: Set VERSION
        id: set_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload GitHub release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            # Release ${{ env.VERSION }}
          # fail, do not release without them, if the mqtt archives are not there
          fail_on_unmatched_files: true
          files: |
            core/target/restheart.tar.gz
            core/target/restheart.zip
            mqtt/target/restheart-mqtt-*.tar.gz
            mqtt/target/restheart-mqtt-*.zip
          draft: true
          prerelease: false

  build-docker-standard:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        mongodb-version: ["8.3"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: restheart-artifacts
          path: core/target/
      - name: Set VERSION
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Extract Version Components
        run: |
          MAJOR=$(echo "$VERSION" | cut -d '.' -f 1)
          MINOR=$(echo "$VERSION" | cut -d '.' -f 2)
          PATCH=$(echo "$VERSION" | cut -d '.' -f 3)
          echo "MAJOR=$MAJOR" >> $GITHUB_ENV
          echo "MINOR=$MINOR" >> $GITHUB_ENV
          echo "PATCH=$PATCH" >> $GITHUB_ENV
      - name: Set Docker Tags for standard images
        id: set_tags
        run: |
          TAGS="softinstigate/restheart:latest,softinstigate/restheart:$MAJOR,softinstigate/restheart:$MAJOR.$MINOR,softinstigate/restheart:$MAJOR.$MINOR.$PATCH"
          echo "TAGS=$TAGS" >> $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and Push multi-arch Docker images
        uses: docker/build-push-action@v7
        with:
          context: ./core/
          platforms: |
            linux/amd64,
            linux/arm64
          push: true
          pull: true
          tags: ${{ env.TAGS }}

  deploy-maven-central:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        mongodb-version: ["8.3"]
    # Central takes up to 20 minutes to validate and publish, and the step waits for it: at 20
    # the job was cancelled seconds after a deployment that had succeeded (9.10.0)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Set up the GraalVM of the runtime image
        uses: ./.github/actions/setup-graalvm-of-the-image

      - name: Import private gpg key
        run: |
          printf "%s" "$GPG_PRIVATE_KEY" > private.key
          gpg --pinentry-mode=loopback --batch --yes --fast-import private.key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Deploy to Maven Central
        # the wrapper pins Maven 3.9: with the Maven 3.10 of the runners the Central bundle carries
        # maven-metadata-local.xml and _remote.repositories next to the artifacts, and Central refuses
        # it, "Bundle has content that does NOT have a .pom file" (central-publishing-maven-plugin
        # issue 79)
        run: |
          MAVEN_OPTS="--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED" \
          ./mvnw -B deploy -Pdeploy -DskipTests -Dmongodb.version="${{ matrix.mongodb-version }}" -s settings.xml
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # Publish @restheart/sdk, the type declarations of the restheart:sdk module of JavaScript
  # plugins (polyglot/sdk), with the version of the tag: the package is versioned in lockstep
  # with RESTHeart, 9.14.0 declares what RESTHeart 9.14.0 provides. Types only, nothing to build.
  deploy-npm:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # npm trusted publishing: the job authenticates with a GitHub OIDC token, accepted by npm for
    # this repository and workflow (tags.yml) as configured on the @restheart/sdk package. No npm
    # token is stored in the repository, and npm attaches the provenance of the build.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@latest

      - name: Set the version from the tag
        working-directory: polyglot/sdk
        run: npm version "${GITHUB_REF#refs/tags/}" --no-git-tag-version

      - name: Publish @restheart/sdk
        working-directory: polyglot/sdk
        run: npm publish --access public

  # Trigger native image build asynchronously (fire-and-forget).
  # Native builds take 30-60 min; running them via gh workflow run
  # decouples them from the parent workflow so tags.yml finishes fast.
  trigger-native-image:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Trigger native image workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          echo "Triggering native-image.yml for version=$VERSION"
          gh workflow run native-image.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f version="$VERSION"
