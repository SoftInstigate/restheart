name: Snapshot Release

on:
  push:
    branches:
      - "**" # All branches for snapshot builds
    tags-ignore:
      - "*" # Ignore all tags
    paths:
      - "**/*.java"
      - "**/*.xml"
      - "**/Dockerfile*"
      - "**/pom.xml"
      - ".github/workflows/*.yml"
      - "**/*.feature"

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    # ubuntu-22.04, not ubuntu-latest: the ubuntu-24.04 image 20261018.339.1 (2026-10-18) brings a
    # Linux kernel 6.19+, on which mongod 8.x refuses to start (TCMalloc and rseq, SERVER-131155, fixed
    # in kernel 7.0.14+). Back to ubuntu-latest when the runners carry a fixed kernel.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          # Official mongo image — MongoDB release compatibility matrix. No
          # $vectorSearch/createSearchIndexes support, so restheart-ai's
          # @requires-vector-search karate scenarios are excluded on these legs.
          - mongodb-version: "7.0"
            mongodb-image: "mongo"
            mongodb-profile: "-P-mongodb,mongodb-classic"
            vector-search: "false"
          - mongodb-version: "8.0"
            mongodb-image: "mongo"
            mongodb-profile: "-P-mongodb,mongodb-classic"
            vector-search: "false"
          - mongodb-version: "8.3"
            mongodb-image: "mongo"
            mongodb-profile: "-P-mongodb,mongodb-classic"
            vector-search: "false"
          - mongodb-version: "9.0"
            mongodb-image: "mongo"
            mongodb-profile: "-P-mongodb,mongodb-classic"
            vector-search: "false"
          # mongodb-atlas-local — the default "mongodb" profile's image (mongod +
          # mongot, self-initializing replica set): runs restheart-ai's vector search
          # tests, which none of the official-mongo legs above can.
          - mongodb-version: "preview"
            mongodb-image: "mongodb/mongodb-atlas-local"
            mongodb-profile: ""
            vector-search: "true"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up the GraalVM of the runtime image
        uses: ./.github/actions/setup-graalvm-of-the-image
      - name: Build and Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          # Live embedding-provider calls (karate/ai/embedding-provider.feature) only run
          # on the atlas-local leg, and only when a VOYAGE_API_KEY secret is configured —
          # never required for the build to pass otherwise. VOYAGE_API_KEY itself is read
          # directly by test-plugins' aiEmbeddingProviderOverrideInterceptor, per request —
          # no other config/env wiring needed.
          KARATE_EMBEDDING=false
          if [ "${{ matrix.vector-search }}" = "true" ] && [ -n "$VOYAGE_API_KEY" ]; then
            KARATE_EMBEDDING=true
          fi
          mvn -B clean verify ${{ matrix.mongodb-profile }} \
            -Dmongodb.image="${{ matrix.mongodb-image }}" \
            -Dmongodb.version="${{ matrix.mongodb-version }}" \
            -Dkarate.vectorSearch="${{ matrix.vector-search }}" \
            -Dkarate.embeddingProvider="$KARATE_EMBEDDING"
      - name: Upload build artifacts for Docker jobs (only for 8.3)
        if: matrix.mongodb-version == '8.3'
        uses: actions/upload-artifact@v6
        with:
          name: restheart-artifacts
          path: |
            core/target/restheart.jar
            core/target/restheart.tar.gz
            core/target/restheart.zip
            core/target/lib/*.jar
            core/target/plugins/*.jar
            core/target/plugins/lib/*.jar

  deploy-maven-central:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        mongodb-version: ["8.3"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up the GraalVM of the runtime image
        uses: ./.github/actions/setup-graalvm-of-the-image
      - name: Import private gpg key
        run: |
          printf "%s" "$GPG_PRIVATE_KEY" > private.key
          gpg --pinentry-mode=loopback --batch --yes --fast-import private.key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Deploy to Maven Central (8.3 only)
        # the wrapper pins Maven 3.9: with the Maven 3.10 of the runners the Central bundle carries
        # maven-metadata-local.xml and _remote.repositories next to the artifacts, and Central refuses
        # it, "Bundle has content that does NOT have a .pom file" (central-publishing-maven-plugin
        # issue 79)
        run: |
          MAVEN_OPTS="--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED" \
          ./mvnw -B deploy -Pdeploy -DskipTests -Dmongodb.version="${{ matrix.mongodb-version }}" -s settings.xml
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  build-docker-standard:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        mongodb-version: ["8.3"]
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: restheart-artifacts
          path: core/target/
      - name: Set SHA
        run: |
          echo "SHA=$(echo ${GITHUB_SHA:0:7})" >> $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and Push multi-arch Docker images (8.3 only)
        uses: docker/build-push-action@v7
        with:
          context: ./core/
          platforms: |
            linux/amd64,
            linux/arm64
          push: true # push all images built
          pull: true # pull all required images before building
          # Tag with "latest" only if branch is master
          tags: |
            softinstigate/restheart-snapshot:${{ env.SHA }},
            ${{ github.ref == 'refs/heads/master' && 'softinstigate/restheart-snapshot:latest' || '' }}
