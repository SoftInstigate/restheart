# Minimal Mosquitto 2.x configuration for the restheart-mqtt demo compose stack.
#
# Mosquitto 2.x ships secure-by-default: with no config at all it refuses every
# anonymous connection, so a bare `docker run eclipse-mosquitto` accepts nobody.
# This file exists solely to remove that friction for the two-minute demo -
# it is not meant as a production configuration.

# Bind a plaintext listener on all interfaces inside the container, so the
# "mosquitto" service is reachable from the "restheart" container on the
# shared compose network.
listener 1883 0.0.0.0

# No authentication for the demo: anyone who can reach the broker can
# publish/subscribe to any topic.
allow_anonymous true

# Do not persist retained messages/subscriptions to disk between runs.
persistence false

# Log to stdout so `docker compose logs mosquitto` shows broker activity.
log_dest stdout
