# RESTHeart configuration overrides for MqttDurabilityIT.
#
# Same shape as it-overrides-mongo.yml, with one deliberate difference: the drain runs every two
# seconds instead of every half second, so the messages the test publishes are still in the buffer
# when it stops RESTHeart - which is the situation the shutdown has to handle.

---
/fileRealmAuthenticator:
  enabled: true
  users:
    - userid: admin
      password: secret
      roles: [admin, user]

# Without --standalone the default config wires basicAuthMechanism to mongoRealmAuthenticator,
# which would want to provision a user in a database this test deliberately stops.
/basicAuthMechanism/authenticator: fileRealmAuthenticator

/logging/log-level: INFO
/logging/no-colors: true
# Logback writes this file directly, with immediate flush. The harness's usual stdout redirect is
# not enough here: this test kills the process with SIGKILL, and whatever the JVM had buffered on
# stdout dies with it - which is precisely the window whose diagnosis matters.
/logging/log-to-file: true
/logging/log-file-path: target/it-logs/MqttDurabilityIT-server.log

/mqtt-client/enabled: true
/mqtt-client/broker-url: tcp://localhost:1883
# Fixed, and clean-session false: the restarted instance resumes the same session, so the broker
# still holds whatever the previous one did not acknowledge.
/mqtt-client/client-id: restheart-durability-it
/mqtt-client/clean-session: false

/mqtt-router/enabled: true

/mqtt-mongo-writer/enabled: true
# so the test can recognise its own messages by _id
/mqtt-mongo-writer/id-strategy: payload-field
/mqtt-mongo-writer/id-field: messageId
/mqtt-mongo-writer/drain/flush-interval-ms: 2000
/mqtt-mongo-writer/mongo-sink:
  - topic: "sensors/#"
    database: "test-mqtt"
    collection: "sensor-events"
