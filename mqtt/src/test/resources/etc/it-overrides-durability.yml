# RESTHeart configuration overrides for MqttDurabilityIT.
#
# Same shape as it-overrides-mongo.yml, with one deliberate difference: the writer is configured
# to retry a failing MongoDB write for a very long time instead of giving up after three attempts.
#
# That difference is the whole test. With the stock retry settings a write against a stopped
# MongoDB fails three times, the batch is dead-lettered, and dead-lettering counts as having taken
# responsibility - so the message IS acknowledged and the broker rightly forgets it. That is
# correct behaviour, but it is not the behaviour under test. Holding the message in retry keeps it
# unacknowledged, which is the state the broker has to be left holding when the instance is killed.

---
/fileRealmAuthenticator:
  enabled: true
  users:
    - userid: admin
      password: secret
      roles: [admin, user]

# Without --standalone the default config wires basicAuthMechanism to mongoRealmAuthenticator,
# which would want to provision a user in a database this test deliberately stops.
/basicAuthMechanism/authenticator: fileRealmAuthenticator

/logging/log-level: INFO
/logging/no-colors: true
# Logback writes this file directly, with immediate flush. The harness's usual stdout redirect is
# not enough here: this test kills the process with SIGKILL, and whatever the JVM had buffered on
# stdout dies with it - which is precisely the window whose diagnosis matters.
/logging/log-to-file: true
/logging/log-file-path: target/it-logs/MqttDurabilityIT-server.log

/mqtt-client/enabled: true
/mqtt-client/broker-url: tcp://localhost:1883
# Fixed, and clean-session false: an MQTT session is keyed on the client id, so without both the
# restarted instance would be a new client with nothing owed to it.
/mqtt-client/client-id: restheart-durability-it
/mqtt-client/clean-session: false

/mqtt-router/enabled: true

/mqtt-mongo-writer/enabled: true
/mqtt-mongo-writer/drain/max-retries: 1000
/mqtt-mongo-writer/drain/retry-delay-ms: 2000
/mqtt-mongo-writer/mongo-sink:
  - topic: "sensors/#"
    database: "test-mqtt"
    collection: "sensor-events"
