# RESTHeart configuration ovverrides for Integration Tests.

---
/http-listener/host: 0.0.0.0

/tokenBasicAuthMechanism/enabled: true

/basicAuthMechanism/authenticator: fileRealmAuthenticator

/digestAuthMechanism/authenticator: fileRealmAuthenticator

/jwtAuthenticationMechanism/enabled: true
/jwtAuthenticationMechanism/usernameClaim: sub
/jwtAuthenticationMechanism/rolesClaim: roles
/jwtAuthenticationMechanism/base64Encoded: false

# apiKeyAuthMechanism shares the Bearer scheme with jwtAuthenticationMechanism: it runs
# first (priority) and declines, with NOT_ATTEMPTED, anything not carrying the prefix.
# Both are enabled here so api-key-auth.feature can prove they actually compose in a
# running instance — the one claim the unit tests structurally cannot reach.
/apiKeyAuthMechanism/enabled: true
/apiKeyAuthMechanism/authenticator: mongoApiKeyAuthenticator
/apiKeyAuthMechanism/prefix: rhak_

/mongoApiKeyAuthenticator/enabled: true
/mongoApiKeyAuthenticator/keys-db: test-apikeys
/mongoApiKeyAuthenticator/keys-collection: keys
# Off so the feature seeds keys and uses them immediately, and so a revocation test
# would not have to wait out a TTL.
/mongoApiKeyAuthenticator/cache-enabled: false

/jwtConfigProvider/enabled: true
/jwtConfigProvider/key: secret
/jwtConfigProvider/algorithm: HS256
/jwtConfigProvider/issuer: restheart.org
/jwtConfigProvider/audience: null
# Claims that survive a per-request override — see the account-properties-claims-override
# feature. "teams" stands in for the claim a real deployment cannot lose (on a multi-tenant
# node, the one naming the issuing node, verified on every later request).
/jwtConfigProvider/required-account-properties-claims:
  - teams

/jwtTokenManager/enabled: true
/jwtTokenManager/ttl: 15
/jwtTokenManager/account-properties-claims:
  - teams

/authCookieSetter/enabled: true
/authCookieSetter/ttl: 15

/fileRealmAuthenticator:
  enabled: true
  users:
    - userid: admin
      password: secret
      roles: [user, admin]

    - userid: test
      password: secret
      roles: [ test ]

    - userid: claimsTest
      password: ClaimsPass123!
      roles: [ user ]
      profile:
        name: FileClaims
      teams: [ acme ]

    - userid: testWithArray
      password: secret
      array: [ one, two, three ]
      roles: [ testWithArray ]

    - userid: testWithEmptyArray
      password: secret
      array: [ ]
      roles: [ testWithArray ]

    - userid: testWithNotExistingArray
      password: secret
      roles: [ testWithArray ]

    - userid: mongoPermissions
      password: secret
      roles: [mongoPermissions]

    - userid: user1
      password: secret
      roles: [poweruser]

    - userid: user2
      password: secret
      roles: [user]

    - userid: noroles
      password: secret
      roles: []

    - userid: full
      password: secret
      roles: [ full ]

    - userid: filtered
      password: secret
      roles: [ filtered ]

    - userid: both
      password: secret
      roles: [ filtered, full ]

/mongoRealmAuthenticator/users-db: restheart-test

/fileAclAuthorizer:
  enabled: true
  permissions:
    - role: admin
      predicate: path-prefix[path="/"]
      priority: 0
      mongo:
          allowManagementRequests: true # default false
          allowBulkPatch: true          # default false
          allowBulkDelete: true         # default false
          allowWriteMode: true          # default false

    - role: owner
      predicate: path-prefix[path="/auth/invite"] or path-prefix[path="/auth/resend-invite"]
      priority: 100

    # 9.6.0: proves ACL gating by the active team role carried in user.team.role.
    # System role is `user` for every verified accounts user; the predicate refines
    # it to only those whose ACTIVE team role is `owner` (via @user.team.role).
    # Exercised by team-role-acl.feature.
    - role: user
      predicate: >
        path-prefix[path="/restheart-test/team-partitioned"]
        and method[value="POST"]
        and equals[@user.team.role, "owner"]
      priority: 100
      mongo:
        allowWriteMode: true
        mergeRequest: >
          {"team": "@user.team._id"}

    - role: $unauthenticated
      predicate: path[path="/auth/invitation"] and method[value="GET"]
      priority: 100

    - role: $unauthenticated
      predicate: path-prefix[path="/testdb/refcoll1"] and method[value="GET"]
      priority: 0
      mongo:
          allowManagementRequests: true # default false
          allowBulkPatch: true          # default false
          allowBulkDelete: true         # default false
          allowWriteMode: true          # default false

    - role: $unauthenticated
      predicate: path-prefix[path="/test-change-streams/anotherColl/_streams"]
      priority: 0
      mongo:
          allowManagementRequests: true # default false
          allowBulkPatch: true          # default false
          allowBulkDelete: true         # default false
          allowWriteMode: true          # default false

    - role: $unauthenticated
      predicate: path-prefix[path="/test-change-streams/coll/_streams"]
      priority: 0
      mongo:
          allowManagementRequests: true # default false
          allowBulkPatch: true          # default false
          allowBulkDelete: true         # default false
          allowWriteMode: true          # default false

    - role: poweruser
      predicate: path-prefix[path="/testdb"] and method[value="GET"]
      priority: 0
      mongo:
          allowManagementRequests: true # default false
          allowBulkPatch: true          # default false
          allowBulkDelete: true         # default false
          allowWriteMode: true          # default false

    - role: poweruser
      predicate: path-prefix[path="/testmytmpdb"]
      priority: 0
      mongo:
          allowManagementRequests: true # default false
          allowBulkPatch: true          # default false
          allowBulkDelete: true         # default false
          allowWriteMode: true          # default false

    - role: user
      predicate: path-prefix[path="/testdb/refcoll2"] and method[value="GET"]
      priority: 0
      mongo:
          allowManagementRequests: true # default false
          allowBulkPatch: true          # default false
          allowBulkDelete: true         # default false
          allowWriteMode: true          # default false

    - role: user
      predicate: path[path="/testdb/refcoll2"] and method[value="GET"]
      priority: 0
      mongo:
          allowManagementRequests: true # default false
          allowBulkPatch: true          # default false
          allowBulkDelete: true         # default false
          allowWriteMode: true          # default false

    - role: user
      predicate: (path[path="/testtmpdb2"] or path[path="/testtmpdb3"]) and method[value="PUT"]
      priority: 0
      mongo:
          allowManagementRequests: true # default false
          allowBulkPatch: true          # default false
          allowBulkDelete: true         # default false
          allowWriteMode: true          # default false

    # This to check the path-template predicate
    - role: user
      predicate: path-template[value="/testtmpdb2/{username}"] and equals[%u, "${username}"]
      priority: 0
      mongo:
          allowManagementRequests: true # default false
          allowBulkPatch: true          # default false
          allowBulkDelete: true         # default false
          allowWriteMode: true          # default false

    # This to check the regex predicate
    - role: user
      predicate: regex[pattern="/testtmpdb3/(.*?)", value="%R", full-match=true] and equals[%u, "${1}"]
      priority: 0
      mongo:
          allowManagementRequests: true # default false
          allowBulkPatch: true          # default false
          allowBulkDelete: true         # default false
          allowWriteMode: true          # default false

    - role: test
      # qparams-whitelist() === qparams-size(0)
      predicate: >
        method(GET)
        and qparams-size(2)
        and qparams-blacklist(size)
        and qparams-whitelist(filter, page, q1)
        and path[path="/secho"]
      priority: 0

    - role : test
      predicate: >
        method(GET)
        and qparams-whitelist(rep)
        and path-prefix[path="/test-predicates/coll"]
      mongo:
        projectResponse: >
          {"log": 0}
      priority: 100

    - role : test
      predicate: >
        method(GET)
        and qparams-whitelist(rep)
        and path-template(value="/test-predicates/coll/{id}")
      priority: 100

    - role: test
      predicate: >
        method(POST)
        and bson-request-contains(title)
        and bson-request-whitelist(title, content)
        and path-prefix[path="/test-predicates/coll"]
      mongo:
        mergeRequest: >
          {"author": "@user.userid", "status": "draft", "log": "@request"}
      priority: 100

    - role: test
      predicate: >
        method(PATCH)
        and path-template(value="/test-predicates/coll/{id}")
      mongo:
        mergeRequest: >
          {"author": "@user.userid", "status": "draft"}
      priority: 100

    - role: testWithArray
      predicate: >
        (method(PUT) or method(GET)) and path-template(value="/test-predicates/coll/{id}")
        and in(value=${id}, array=@user.array)
      priority: 100
      mongo:
        allowWriteMode: true

    # projectResponse
    - role : test
      predicate: >
        method(GET)
        and path-prefix[path="/test-predicates/projectResponse"]
      mongo:
        projectResponse: >
          {"user": 1}
      priority: 100


    - role : test
      predicate: >
        method(POST)
        and path-prefix[path="/test-predicates/projectResponse"]
      mongo:
        mergeRequest: >
          {"user" : "@user.userid"}
      priority: 100

    # mongo permissions
    - role: mongoPermissions
      predicate: path-prefix[path="/test-all-permissions"]
      priority: 0
      mongo:
          allowManagementRequests: true # default false
          allowBulkPatch: true          # default false
          allowBulkDelete: true         # default false
          allowWriteMode: true          # default false


    - role: mongoPermissions
      predicate: path-prefix[path="/test-no-permissions"]
      priority: 0

    # restheart-stripe registers no ACL rule of its own for these (only /stripe/webhook
    # is self-registered, since it has no authenticated caller) — a deployment must grant
    # access itself. Exercised by karate/stripe/licenses-and-subscription.feature.
    - role: user
      predicate: >
        (path-prefix(path="/stripe/checkout")
        or path-prefix(path="/stripe/portal")
        or path-prefix(path="/stripe/subscription")
        or path-prefix(path="/stripe/licenses"))
      priority: 100

    # products mode: customers create orders and browse the catalog. The module registers
    # no ACL rule for these collections — a deployment grants access itself.
    # Exercised by karate/stripe/products-*.feature.
    - role: user
      predicate: >
        path-prefix(path="/restheart-test/orders")
        or path-prefix(path="/restheart-test/catalog")
      priority: 100

    # Exercises the @subscription ACL variable end to end (webhook/admin-driven MongoDB
    # write -> SubscriptionVarResolver -> predicate). Exercised by
    # karate/stripe/subscription-acl-variable.feature.
    - role: user
      predicate: >
        path-prefix(path="/restheart-test/stripe-gated")
        and equals(@subscription.plan, "gold")
      priority: 100
      mongo:
        # the feature PUTs with ?wm=upsert; without this the mongoPermissionAllowWriteMode
        # transformer ANDs a false predicate into the permission and it never matches
        allowWriteMode: true

/mongoAclAuthorizer/acl-db: restheart-test
/mongoAclAuthorizer/cache-enabled: false

/mongo/mongo-mounts:
  - what: '*'
    where: /
  - what: 'restheart-test/users'
    where: /users
  - what: 'restheart-test/teams'
    where: /teams
  - what: 'restheart-test/auth_invitations'
    where: /auth_invitations
  - what: '*'
    where: /remappedall
  - what: /testdb
    where: /remappeddb
  - what: /testdb/refcoll1
    where: /remappedrefcoll1
  - what: /testdb/refcoll2
    where: /remappedrefcoll2
  - what: /testdb/refcoll1/doc1
    where: /remappeddoc1
  - what: /testdb/refcoll2/doc2
    where: /remappeddoc2

/mongo/default-representation-format: HAL

/graphql/db: test-graphql
/graphql/verbose: true

/proxies:
 - location: /pecho
   proxy-pass: http://127.0.0.1:8080/echo
 - location: /piecho
   proxy-pass: http://127.0.0.1:8080/iecho
 - location: /anything
   proxy-pass: https://httpbin.org/anything

/testInitializer/enabled: true

/authTokenService:
  enabled: true
  uri: /token
  redirect-url: "http://localhost:8080/secho"

/oauthAuthorizationServerMetadataService:
  enabled: true
  authorize-endpoint-uri: /authorize
  registration-endpoint-uri: /register

/oauthAuthorizationService:
  enabled: true
  login-url: http://localhost:3000/login
  allowed-redirect-uris:
    - http://localhost:*

/oauthProtectedResourceMetadataService/enabled: true

/oauthClientRegistrationService/enabled: true

/ping/msg: 'Ping!'

/roles/uri: /roles

/echo/uri: /echo

/secho:
  uri: /secho
  enabled: true

/iecho:
  uri: /iecho
  enabled: true

/echoRequestInterceptor/enabled: true

/echoResponseInterceptor/enabled: true

/echoAsyncResponseInterceptor/enabled: true

/echoProxyRequestInterceptor/enabled: true

/echoProxyResponseInterceptor/enabled: true

/secretHider/enabled: true

/logMessageInitializer:
  enabled: false
  message: Hello World!
  log-level: INFO

/addBodyToWriteResponsesInitializer:
  enabled: false

/snooper:
  enabled: true

/writeResult:
  enabled: true

/logging/log-level: DEBUG
/logging/no-colors: true
/core/name: integration-test

# restheart-accounts
/accountsConfig/enabled: true
# db and users-collection are sourced from mongoRealmAuthenticator
# (see /mongoRealmAuthenticator/users-db above)
/accountsConfig/account-properties-claims:
  - teams
/accountsConfig/app-name: TestApp
/accountsConfig/jwt-ttl: 15
/accountsConfig/cookie-domain: localhost
/accountsConfig/frontend-url: http://localhost:4200
/accountsConfig/frontend-app-url: http://localhost:4200/app
/accountsConfig/terms-version: "1.0"
/accountsConfig/privacy-version: "1.0"
# 'admin' is exempt from accountsInitializer's /users self-service write restriction —
# used by users-write-restriction.feature to test the bypass path.
/accountsConfig/users-unrestricted-roles:
  - admin

/accountsService/enabled: true
/accountsInitializer/enabled: true

/registerService/enabled: true
/emailVerificationService/enabled: true
/forgotPasswordService/enabled: true
/resetPasswordService/enabled: true
/activateService/enabled: true
/inviteService/enabled: true
/resendInviteService/enabled: true
/getTeamsService/enabled: true
/switchTeamService/enabled: true
/acceptInviteService/enabled: true
/invitationInfoService/enabled: true
/removeMemberService/enabled: true
/updateMemberRoleService/enabled: true
/listTeamMembersService/enabled: true
/teamService/enabled: true
/updateProfileService/enabled: true
/changePasswordService/enabled: true
/tokenFailedAuthInterceptor/enabled: true

# Test interceptor: attaches override-users-db when ?_db-override=<db> is present.
# Used by db-override-membership.feature to verify DefaultMembershipProvider
# resolves the database per-request. Does not affect other tests.
/dbOverrideInterceptor/enabled: true

# Test interceptor: attaches override-accounts-account-properties-claims when
# ?_claims-override=<a,b,c> is present. Used by
# account-properties-claims-override.feature to verify the per-request override (#661)
# and that JwtHelper's denylist cannot be bypassed by it. Does not affect other tests.
/accountPropertiesClaimsOverrideInterceptor/enabled: true

/emails/enabled: true
# Dummy SMTP config — emails are not sent in tests (X-Skip-Email: true intercepts before sending)
/emails/smtp-hostname: localhost
/emails/smtp-port: 25
/emails/smtp-username: test
/emails/smtp-password: test
/emails/sender-email: noreply@test.example.com

/oauthConfig/enabled: true
/oauthConfig/api-base-url: http://localhost:8080
/oauthConfig/frontend-success-url: http://localhost:4200/app
/oauthConfig/frontend-error-url: http://localhost:4200/login?error=oauth_error
/oauthConfig/providers/test/enabled: true
/oauthConfig/providers/test/client-id: test-client
/oauthConfig/providers/test/client-secret: test-secret
/oauthConfig/providers/test/scope: email

/oauthService/enabled: true
/oauthInitiator/enabled: true
/oauthCallback/enabled: true
/testOAuthProvider/enabled: true

# Test interceptor: attaches override-accounts-oauth-* when ?_oauth-override=1
# is present. Used by oauth-invite.feature to verify per-team OAuth overrides
# are honored on both the authorize AND callback legs. Does not affect other tests.
/oauthOverrideInterceptor/enabled: true

# restheart-stripe — db/teams-collection are sourced from mongoRealmAuthenticator
# (see /mongoRealmAuthenticator/users-db above), same "teams" collection accountsConfig
# uses. secret-key is a fake sk_test_ value: the karate suite only exercises paths that
# never call the real Stripe API (webhook signature verification against
# webhook-secret, and the auth checks on checkout/portal/licenses).
/stripeConfig/enabled: true
/stripeConfig/secret-key: sk_test_fake_key_for_tests_only
/stripeConfig/webhook-secret: whsec_test_secret_for_karate_tests
/stripeConfig/subscriptions/enabled: true
/stripeConfig/subscriptions/default-plan: free
/stripeConfig/subscriptions/success-url: http://localhost:4200/billing?success=true
/stripeConfig/subscriptions/cancel-url: http://localhost:4200/billing?canceled=true
/stripeConfig/subscriptions/portal-return-url: http://localhost:4200/billing
/stripeConfig/subscriptions/plans/free/seats/mode: capped
/stripeConfig/subscriptions/plans/free/seats/max: 1
/stripeConfig/subscriptions/plans/gold/price-id-monthly: price_test_gold_monthly
/stripeConfig/subscriptions/plans/gold/price-id-annual: price_test_gold_annual
/stripeConfig/subscriptions/plans/gold/seats/mode: capped
/stripeConfig/subscriptions/plans/gold/seats/max: 10

# products mode. The catalog/orders/transactions collections live in restheart-test
# (sourced from mongoRealmAuthenticator/users-db, same as everything else here).
/stripeConfig/products/enabled: true
/stripeConfig/products/catalog-collection: catalog
/stripeConfig/products/orders-collection: orders
/stripeConfig/products/transactions-collection: transactions
/stripeConfig/products/default-currency: eur
/stripeConfig/products/buyer-email-field: sub
/stripeConfig/products/success-url: http://localhost:4200/shop/done?session={CHECKOUT_SESSION_ID}
/stripeConfig/products/cancel-url: http://localhost:4200/shop/cart
/stripeConfig/products/session-expires-minutes: 60
/stripeConfig/products/max-line-items: 5
/stripeConfig/products/max-quantity-per-line: 10
# off: Stripe Tax would require a live account, and these tests never reach Stripe
/stripeConfig/products/automatic-tax: false

/stripeService/enabled: true
/stripeInitializer/enabled: true
/stripeCheckoutService/enabled: true
/stripePortalService/enabled: true
/stripeSubscriptionService/enabled: true
/stripeWebhookService/enabled: true
/stripeLicensesService/enabled: true
/stripePlansService/enabled: true
/stripeCatalogCache/enabled: true
/ordersCheckoutInterceptor/enabled: true
/ordersCheckoutResponseInterceptor/enabled: true

# restheart-ai. Safe to leave enabled for the whole suite: vectorSearchIndexList/Delete
# Interceptors catch-and-log when Atlas Search isn't available (any GET/DELETE
# /_indexes elsewhere in the suite just no-ops), and documentChunkingInterceptor
# catches Tika/GridFS errors the same way — neither affects tests that don't target
# them. Only karate/ai/*.feature actually exercises these; those scenarios are tagged
# @ignore (see RunnerIT's class javadoc, same mechanism as streams.feature) because
# running them needs MongoDB swapped for one with $vectorSearch + createSearchIndexes
# support, e.g.:
#   docker run -p 27017:27017 -e DO_NOT_TRACK=1 mongodb/mongodb-atlas-local:preview
# then, after temporarily removing @ignore from the karate/ai/*.feature files:
#   mvn -pl core verify -Dit.test=RunnerIT -Dkarate.path=classpath:karate/ai
/vectorSearchIndexCreateInterceptor/enabled: true
/vectorSearchIndexListInterceptor/enabled: true
/vectorSearchIndexDeleteInterceptor/enabled: true
/documentChunkingInterceptor/enabled: true
