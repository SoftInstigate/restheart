Args = --initialize-at-build-time=org.restheart.plugins.PluginsScanner,io.github.classgraph.,nonapi.io.github.classgraph.,org.apache.commons.jxpath.ri.JXPathContextFactoryReferenceImpl,org.restheart.plugins.PluginDescriptor,org.restheart.plugins.FieldInjectionDescriptor,org.restheart.plugins.MethodInjectionDescriptor,com.github.benmanes.caffeine.cache,org.restheart.graal.ResourcesScannerFeature \
    --initialize-at-run-time=com.mongodb.UnixServerAddress,com.mongodb.internal.connection.SnappyCompressor \
    -J-Dfile.encoding=UTF-8 \
    -J-Dangus.activation.native-image.enable=false \
    -Djava.awt.headless=true \
    -o restheart \
    -H:+ReportExceptionStackTraces \
    --features=org.restheart.graal.PluginsReflectionRegistrationFeature,org.restheart.graal.PluginsClassloaderInitFeature,org.restheart.graal.ResourcesScannerFeature \
    --add-exports=java.net.http/jdk.internal.net.http=org.graalvm.truffle \
    --add-modules=org.graalvm.polyglot \
    --enable-native-access=org.graalvm.truffle

# --gc=G1 G1 can only be used in native images that are built on Linux for AMD64 with GraalVM Oracle
# --add-exports=java.net.http allows using java.net.http in JavaScript
# http and https URL protocols are enabled through the reflection entries for sun.net.www.protocol.*.Handler
# in reachability-metadata.json: --enable-url-protocols, --enable-http and --enable-https are deprecated since GraalVM 25.1,
# and --no-fallback has no effect any more, fallback images are gone
# angus-activation (a runtime dependency of restheart-ai through Tika and JAXB) registers its own native-image
# Feature, which loads a jakarta.mail data handler and fails the build with NoClassDefFoundError: jakarta/mail/Part,
# since jakarta.mail is not on the classpath; the property above is the feature's own switch to stay out.
# -Djava.awt.headless=true is what GraalVM asks for AWT in a native image: PDFBox initializes java.awt.image
# classes when Tika extracts text from a PDF, and the headless libawt is the one the image can load
# -Ob enables quick build mode. use only for development!